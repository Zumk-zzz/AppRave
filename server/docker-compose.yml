services:
  db:
    image: postgres:17-alpine
    container_name: apprave-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: apprave
      POSTGRES_PASSWORD: apprave
      POSTGRES_DB: apprave
    ports:
      # 5433 снаружи: на 5432 у разработчика уже сидит нативный
      # PostgreSQL как служба Windows, и его трогать незачем.
      # Внутри контейнера порт остаётся стандартным.
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Без проверки API стартует раньше базы и падает на первом запросе
      test: ["CMD-SHELL", "pg_isready -U apprave -d apprave"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
